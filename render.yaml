# Render blueprint - one web service, one public URL (FastAPI serves the API
# and the built React app from the same origin).
#
# Dashboard: New -> Blueprint -> connect this repo. Render reads this file,
# builds ./Dockerfile, and gives you https://<name>.onrender.com.
#
# Free plan behaviour (deliberate trade-off, see DECISIONS.md D13):
#   * spins down after 15 min without traffic; the next request waits ~1 min
#   * the filesystem is EPHEMERAL on free instances: bookings and
#     conversations are lost on every redeploy, restart AND spin-down.
#     Clinic seed data is recreated on every boot, so the demo always opens
#     with the same patients, doctors and slots - just not the same bookings.
#   * 750 free instance hours per calendar month across the workspace.
# Keep a reviewer's session alive by clicking the app every few minutes, or
# move to the paid plan below for real persistence.

services:
  - type: web
    name: swasthiq-front-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # sync: false => prompted once in the dashboard, never stored in git.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # --- persistence upgrade (paid Starter, $7/mo) ---------------------------
  # Render free instances cannot attach disks; upgrading lets the sqlite file
  # survive restarts. Uncomment the disk block AND the DATABASE_URL var:
  #
  #   - key: DATABASE_URL
  #     value: sqlite:////render/clinic.db
  #
  #   disk:
  #     name: clinic-db
  #     mountPath: /render      # Render requires paths under /render
  #     sizeGB: 1
